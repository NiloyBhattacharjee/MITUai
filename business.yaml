  - {id: M05, name: Chai Latte, category: tea, price: 5.50, description: "House-brewed spiced chai with steamed milk.",
     options: ["Size*: Regular, Large +0.80", "Milk: Full cream, Oat +0.80, Almond +0.80, Soy +0.80"], allergens: [milk], aliases: [chai]}
