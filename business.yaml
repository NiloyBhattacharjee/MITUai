# Everything about the business lives here. Swap this file to run a different shop.
name: Shuta Fashion
name_bn: সুতা ফ্যাশন
agent_name: Mitu
timezone: Asia/Dhaka
location: "Online shop, pickup point: House 12, Road 5, Dhanmondi, Dhaka 1205"
hours: "Every day 10am–9pm (online orders taken 24/7, replies by a human only during these hours)"
about: "Small Dhaka clothing shop selling panjabis, kurtis, sarees, shirts and more through Facebook and WhatsApp."

delivery:
  inside_dhaka: {label: Inside Dhaka, charge: 70, time: "1–2 days"}
  outside_dhaka: {label: Outside Dhaka, charge: 130, time: "3–5 days"}

payment_methods:
  cod: {label: Cash on delivery, note: "Pay the rider when you receive the parcel."}
  bkash: {label: bKash, note: "Our team sends the bKash merchant number after the order is confirmed. After paying, send the transaction ID (TrxID) here."}
  nagad: {label: Nagad, note: "Our team sends the Nagad merchant number after the order is confirmed. After paying, send the transaction ID (TrxID) here."}

return_policy: >-
  Exchange or return within 3 days of delivery if the item is unused with tags on.
  Size exchange is free inside Dhaka; outside Dhaka the customer pays the delivery charge.
  Sale items cannot be returned. Refunds go back via bKash/Nagad within 5 working days.

# Fixed replies that bypass the LLM (bilingual on purpose: we may not know the language yet).
messages:
  handoff: "ঠিক আছে, আমাদের টিমের একজন শিগগিরই এখানে উত্তর দেবেন। (A team member will reply here shortly.)"
  unsupported_media: "দুঃখিত, আমি এখন শুধু টেক্সট আর ভয়েস মেসেজ বুঝতে পারি। চাইলে লিখে পাঠান, অথবা আমাদের টিমের কারো সাথে কথা বলতে চাইলে বলুন। (Sorry, I can only read text and voice notes for now — type your question, or ask for a human.)"
  voice_unclear: "দুঃখিত, ভয়েস মেসেজটা পরিষ্কার বুঝতে পারিনি। আরেকবার বলবেন, নাকি লিখে পাঠাবেন? (Sorry, I couldn't catch that voice note — could you say it again or type it?)"
  voice_too_long: "ভয়েস মেসেজটা একটু বড় হয়ে গেছে। ২ মিনিটের ছোট মেসেজ বা লিখে পাঠালে ভালো হয়। (That voice note is a bit long — please send one under 2 minutes, or type it.)"
  error: "দুঃখিত, একটু সমস্যা হচ্ছে। আমাদের টিমের একজন শিগগিরই উত্তর দেবেন। (Sorry, something went wrong — a team member will reply soon.)"
  # Sent to the customer when the owner changes an order's status ({order_id} is filled in).
  order_confirmed: "আপনার অর্ডার #{order_id} কনফার্ম হয়েছে। ধন্যবাদ! (Your order #{order_id} is confirmed. Thank you!)"
  order_shipped: "আপনার অর্ডার #{order_id} পাঠিয়ে দেওয়া হয়েছে, শিগগিরই পৌঁছে যাবে। (Your order #{order_id} has been shipped and is on its way.)"
  order_delivered: "আপনার অর্ডার #{order_id} ডেলিভারি হয়েছে। আমাদের থেকে কেনার জন্য ধন্যবাদ! (Your order #{order_id} has been delivered. Thanks for shopping with us!)"
  payment_received: "অর্ডার #{order_id} এর পেমেন্ট পেয়েছি, ধন্যবাদ! (We've received your payment for order #{order_id}. Thank you!)"
  order_cancelled: "আপনার অর্ডার #{order_id} বাতিল করা হয়েছে। কোনো প্রশ্ন থাকলে এখানে জানান। (Your order #{order_id} has been cancelled. Message us here if you have any questions.)"

