# Everything about the business lives here. Swap this file to run a different café or restaurant (examples/ has a salon and an online shop).
name: Little Fern Café
agent_name: Mitu
# alert_email: owner@example.com   # who gets "needs a person" and approval emails (default: ALERT_EMAIL in .env)
timezone: Australia/Sydney
currency: "$"
location: "42 King Street, Newtown NSW 2042. Street parking on King St, Newtown station is a 5-minute walk."
about: "Neighbourhood café: specialty coffee, all-day breakfast and lunch, and dinner on Thursday to Saturday. Dine in, pickup or local delivery."

# Opening hours (24-hour clock). Several periods: "07:00-11:00, 17:00-21:00". Leave a day out (or write closed) to close it.
# Orders and bookings are only accepted for times inside these.
hours:
  mon: "07:00-15:00"
  tue: "07:00-15:00"
  wed: "07:00-15:00"
  thu: "07:00-21:00"
  fri: "07:00-21:00"
  sat: "08:00-21:00"
  sun: "08:00-15:00"
prep_minutes: 15  # the earliest an order can be ready after it's placed
quote_reminder_minutes: 10  # one nudge if a customer doesn't answer an order summary

# Orders are for today only. needs_address: the customer must give a delivery address.
fulfilment:
  pickup: {label: Pickup, fee: 0, note: "Collect at the counter, mention your name."}
  delivery: {label: Delivery, fee: 6.00, needs_address: true, note: "Within 3 km of the café (Newtown, Enmore, Erskineville, Camperdown). Allow 30-45 minutes."}

payment_methods:
  in_person: {label: Pay in person, note: "Pay by card or cash when you collect, or to the driver on delivery."}

reservations:
  capacity: 40                  # seats; bookings within a sitting's length of each other share them
  sitting_minutes: 90
  max_party: 8                  # bigger groups go to the team
  last_booking_before_close: 60 # minutes before closing
  days_ahead: 30

allergen_note: "Our kitchen handles nuts, gluten, dairy, eggs and soy, so we can't guarantee any dish is free of them."

# Fixed replies that bypass the LLM, and messages the dashboard sends ({order_id}, {when} and {party_size} are filled in).
messages:
  handoff: "No problem, someone from our team will reply here shortly."
  unsupported_media: "Sorry, I can only read text, voice notes and photos (JPG/PNG) for now. Type your question, or ask for a person."
  voice_unclear: "Sorry, I couldn't catch that voice note. Could you say it again or type it?"
  voice_too_long: "That voice note is a bit long. Please send one under 2 minutes, or type it."
  error: "Sorry, something went wrong on our side. Someone from our team will reply soon."
  order_preparing: "We're making your order #{order_id} now."
  order_ready_pickup: "Your order #{order_id} is ready to collect at the counter."
  order_ready_delivery: "Your order #{order_id} is on its way."
  order_cancelled: "Your order #{order_id} has been cancelled. Message us here if you have any questions."
  booking_cancelled: "Your booking for {party_size} on {when} has been cancelled. Message us here if you have any questions."
  quote_reminder: "Just checking: would you like me to place your order ({total})? Reply yes to confirm, or tell me what to change."
  # When staff answer a request in the dashboard's Approvals page ({summary} and {note}, the staff's message, are filled in).
  approval_approved: "Good news: the team approved your request ({summary}). {note}"
  approval_declined: "Sorry, the team couldn't approve your request ({summary}). {note}"
  large_booking_approved: "Good news: your table for {party_size} on {when} is booked (booking #{booking_id}). {note}"

# Quick replies staff can insert in the dashboard's chat box.
saved_replies:
  - "Thanks for your patience! We're looking into it now."
  - "Sorry about that! We'll make it right. Could you tell us a bit more about what happened?"
  - "Your order is on its way and should be with you shortly."
  - "We've got your booking noted. See you soon!"
  - "Thanks for letting us know. We've passed this on to the kitchen."

# The menu. price in your currency. options, one line per group:
#   "Name*: A, B +0.80"     pick exactly one (the * makes it required); +0.80 is the extra cost
#   "Name: A, B"            pick at most one
#   "Name (any): A, B +1"   pick any number
# dietary / allergens: the assistant only ever repeats what is written here. available: false = sold out.
menu:
  - {id: M01, name: Flat White, category: coffee, price: 5.00, description: "Double ristretto with silky steamed milk.",
     options: ["Size*: Regular, Large +0.80", "Milk: Full cream, Skim, Oat +0.80, Almond +0.80, Soy +0.80", "Extras (any): Extra shot +0.60, Decaf, Vanilla syrup +0.70"],
     allergens: [milk], aliases: [flatwhite, fw, coffee]}
  - {id: M02, name: Latte, category: coffee, price: 5.00, description: "Espresso with plenty of steamed milk.",
     options: ["Size*: Regular, Large +0.80", "Milk: Full cream, Skim, Oat +0.80, Almond +0.80, Soy +0.80", "Extras (any): Extra shot +0.60, Decaf, Vanilla syrup +0.70"],
     allergens: [milk], aliases: [cafe latte, coffee]}
  - {id: M03, name: Cappuccino, category: coffee, price: 5.00, description: "Espresso, steamed milk, thick foam and chocolate dusting.",
     options: ["Size*: Regular, Large +0.80", "Milk: Full cream, Skim, Oat +0.80, Almond +0.80, Soy +0.80", "Extras (any): Extra shot +0.60, Decaf"],
     allergens: [milk], aliases: [cappucino, capp, coffee]}
  - {id: M04, name: Long Black, category: coffee, price: 4.50, description: "Double espresso over hot water.",
