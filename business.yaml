  - {id: M07, name: Fresh Orange Juice, category: cold drinks, price: 7.00, description: "Squeezed to order.", dietary: [vegan, gluten-free], aliases: [oj, juice]}
  - {id: M08, name: Smashed Avo on Sourdough, category: breakfast, price: 19.00, description: "Avocado, feta, cherry tomatoes, dukkah and lemon on toasted sourdough.",
     options: ["Add (any): Poached egg +3.50, Bacon +5.00, Halloumi +5.00", "Bread: Sourdough, Gluten-free +2.00"],
