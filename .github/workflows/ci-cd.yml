# CI: every push and pull request runs the backend tests and builds the frontend.
# CD: pushes to main also build Docker images into GitHub Container Registry (ghcr.io), then deploy them
#     to your server over SSH, once these repository secrets exist:
#       ENV_FILE        the production .env file (all app secrets)
#       DEPLOY_HOST     server address        DEPLOY_USER  SSH user (must be able to run docker)
#       DEPLOY_SSH_KEY  private key for that user
#     Without DEPLOY_HOST the images are still built; the deploy job just says it skipped.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # same as backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q  # uses a fake LLM and a mocked Meta API: needs no secrets

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # same as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    name: Docker image (${{ matrix.service }})
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to server
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Skip (no server configured)
        if: env.DEPLOY_HOST == ''
        run: echo "::notice::Images are on ghcr.io. Add the DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY secrets to deploy them."
      - uses: actions/checkout@v4
        if: env.DEPLOY_HOST != ''
      - name: Deploy over SSH
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # ponytail: trusts the server's host key on first contact; pin it in a DEPLOY_KNOWN_HOSTS secret for stricter checking.
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          target="$DEPLOY_USER@$DEPLOY_HOST"
          run() { ssh -i ~/.ssh/deploy "$target" "$@"; }
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"

          run 'mkdir -p ~/mituai'
          scp -i ~/.ssh/deploy docker-compose.yml business.yaml "$target:mituai/"
          printf '%s\n' "$ENV_FILE" | run 'umask 077 && cat > ~/mituai/.env'
          printf '%s' "$GHCR_TOKEN" | run "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          run "cd ~/mituai && export IMAGE_PREFIX=$prefix IMAGE_TAG=${{ github.sha }} && docker compose pull && docker compose up -d --remove-orphans"
