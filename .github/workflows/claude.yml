# Claude works on an issue or PR when someone with write access mentions @claude in it, or adds the "claude" label to
# an issue. It reads AGENTS.md, makes the change on a claude/ branch, runs the tests and opens a pull request link.
# Needs one repository secret: ANTHROPIC_API_KEY (or run /install-github-app in Claude Code, which sets it up).
# Each run uses the paid API; it never merges.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The same toolchain as CI, so Claude can run the checks AGENTS.md asks for.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(cd:*),Bash(python:*),Bash(pip:*),Bash(npm:*),Bash(git:*),Bash(ls:*),Bash(cat:*),Bash(grep:*)"
